[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=77.0.0",
]

[project]
name = "rgs-django-utils"
description = "Functions related to Django, shared between projects"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
authors = [
    { name = "Bastiaan Roos", email = "bastiaan.roos@roosgeo.nl" }
]
maintainers = [
    { name = "Bastiaan Roos" }
]
keywords = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Django",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "Django>=5.0,<6.1",
  "django-ninja~=1.6.0",
  "pyJWT[crypto]>=2.12.0",
  "SQLAlchemy~=2.0.0",
  "GeoAlchemy2~=0.20.0",
  "xlsxwriter>=3.2.4,<4",
  "python-dotenv>=1.1,<2",
  "psycopg>=3.2,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "geopandas>=1.0,<2",
  "shapely>=2.0,<3",
]
dynamic = ["version"]

[project.urls]
repository = "https://github.com/GetThePointGit/rgs-django-utils"

[tool.setuptools]
packages = { find = { include = ["rgs_django_utils*"] } }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "rgs_django_utils.__version__" }

# FORMATTING
[tool.ruff]
# De kernregels (line-length, select, ignore, format, numpy-docstrings,
# __init__-ignores) staan in ruff-gedeeld.toml: een byte-gelijke kopie van de
# gedeelde config uit GetThePointGit/rgs-dev-config. Niet hier overschrijven;
# bijwerken met `rgs-config sync-ruff .`, `rgs-config check` meldt drift.
extend = "ruff-gedeeld.toml"

# Repo-eigen uitsluitingen.
extend-exclude = [".pixi/*", "var/*", "migrations/*",]

[tool.ruff.lint.extend-per-file-ignores]
# Re-export pattern: __init__.py legitimately uses `from .submodule import *`
# and unused-looking imports to expose the public API of the package
# (F401/F403/I001 komen uit de gedeelde config).
"__init__.py" = ["F405"]
# Command-style modules run `setup_django()` inside `if __name__ == "__main__":`
# and must do follow-up imports only after Django is initialised.
"rgs_django_utils/commands/*.py" = ["E402"]
"rgs_django_utils/management/commands/*.py" = ["E402"]

[tool.pylint]
disable = ["W1203"]
