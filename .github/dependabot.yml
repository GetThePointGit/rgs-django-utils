version: 2

# Template uit GetThePointGit/rgs-dev-config (packages/dev-config/templates/
# dependabot.yml); de afspraken staan in docs/dependencies.md daar.
# Alleen GitHub Actions: pixi/pypi kent Dependabot niet (bumpen is handwerk,
# `pixi update`), en er is geen npm of Docker in deze repo.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
