name: tests

# Pull requests test only the production combination (Python 3.12 + Django
# 5.2, what waterworks runs). Pushes to main, the weekly schedule and a manual
# run test the full matrix, equal to the tox envlist (Python 3.11 is skipped:
# `requires-python = ">=3.12"`).
#
# The `main` jobs really run Django's main branch (tox installs it after the
# package, see tox.ini) as an early warning for the next release (6.2 LTS,
# ww#661). They are `continue-on-error`: a broken Django main must not turn
# the run red. Check the job log for "Django 6.x.dev..." to see what ran.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches:
      - '**'
  schedule:
    # Monday 05:00 UTC: catches breakage from Django main and new releases.
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret-scan (waterworks#938), zelfde opzet als de job `gitleaks` in
  # waterworks (ww#820; uitleg in docs/gitleaks.md daar). Bij een PR alleen de
  # commits van de PR, bij push en handmatig starten de huidige bestanden.
  # Gitleaks als CLI met vaste versie en checksum: de gitleaks-action vraagt
  # voor organisaties een licentiesleutel. Vals-positief op één regel: zet
  # `gitleaks:allow` als commentaar op die regel.
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Installeer gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan op secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "scan van de PR-commits $BASE..$HEAD"
            "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --log-opts="$BASE..$HEAD" .
          else
            echo "$EVENT: scan van de huidige bestanden"
            "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --verbose .
          fi

  run_unittest_tests:
    name: py${{ matrix.python-version }}-django${{ matrix.django-version }}
    runs-on: ubuntu-24.04
    # Django main is a pre-release moving target: report, don't block (#53).
    continue-on-error: ${{ matrix.django-version == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.12", "3.13"]') }}
        django-version: ${{ fromJSON(github.event_name == 'pull_request' && '["5.2"]' || '["5.2", "6.0", "6.1", "main"]') }}

    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5431:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache uv downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-django${{ matrix.django-version }}-${{ hashFiles('pyproject.toml', 'tox.ini') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-django${{ matrix.django-version }}-

      - name: Install system dependencies
        # Only the GDAL runtime library is needed (Django loads it via ctypes);
        # skipping the -dev headers, recommends and the man-db trigger saves
        # most of the apt time.
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin

      - name: Install Python dependencies
        # tox-uv: tox creates its environments with uv instead of pip.
        run: pip install tox tox-uv

      - name: Run unittest Python ${{ matrix.python-version }} -- Django ${{ matrix.django-version }}
        env:
          TOXENV: py${{ matrix.python-version }}-django${{ matrix.django-version }}
        run: tox

  run_quality_tests:
    name: Quality tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pre-commit hook environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install Dependencies
        run: |
          pip install tox

      - name: Quality tests
        env:
          TOXENV: quality
        run: |
          tox

  dev-config:
    # Gedeelde dev-config-afspraken (ruff-kopie, editorconfig, Dependabot) uit
    # GetThePointGit/rgs-dev-config; zie docs/dependencies.md daar. Deze repo is
    # publiek en mag de herbruikbare workflow dev-config-check.yml uit die
    # (private) repo niet aanroepen ("workflow file issue", geen jobs); daarom
    # dezelfde stap hier inline. De CLI komt uit GitHub Packages: het
    # Actions-secret GH_PAT_RGS_LIBS (read:packages) moet voor deze repo
    # beschikbaar zijn.
    name: rgs-config check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@getthepointgit"
      - run: npx --yes --package @getthepointgit/dev-config@latest -- rgs-config check --dir . --strict
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT_RGS_LIBS }}
